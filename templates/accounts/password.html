{% extends "base.html" %}{% load i18n %}
{% block content %}
<h1>{% translate "Change password" %}</h1>
{% include "_error.html" %}
<form method="post" class="stack narrow">{% csrf_token %}
  <label>{% translate "Current password" %}<input type="password" name="current" required autocomplete="off"></label>
  <label>{% translate "New password" %}<input type="password" name="new" required autocomplete="new-password"></label>
  <label>{% translate "Repeat the password" %}<input type="password" name="new2" required autocomplete="new-password"></label>
  <button class="btn">{% translate "Save password" %}</button>
</form>
{% endblock %}
